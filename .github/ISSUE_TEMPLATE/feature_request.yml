name: Feature request
description: Propose a focused editor or agent workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Drawing problem
      description: What human or agent workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, including collaboration and undo expectations.
    validations:
      required: true
  - type: textarea
    id: formats
    attributes:
      label: File or provider impact
      description: Note native schema, interchange, MCP, provider, performance, or security implications.
