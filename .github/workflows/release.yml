name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            node-platform: win32
            node-arch: x64
          - os: macos-latest
            platform: macos-arm64
            node-platform: darwin
            node-arch: arm64
          - os: ubuntu-latest
            platform: linux-x64
            node-platform: linux
            node-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify native release host identity
        run: node scripts/check-portability.mjs --expect-platform=${{ matrix.node-platform }} --expect-arch=${{ matrix.node-arch }}
      - run: npm ci --cache .npm-cache
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
      - run: npm run verify
      - run: npm run test:performance
      - run: npm run security:verify
      - run: npm run make
      - run: node scripts/verify-package.mjs
      - run: npm run test:e2e:only
        if: runner.os == 'Windows'
        env:
          AIDRAW_E2E_LAUNCH_CONTEXT: unsandboxed-gui
      - run: npm run checksums
        env:
          AIDRAW_CHECKSUM_FILE: SHA256SUMS-${{ matrix.platform }}.txt
      - run: npm run licenses
        if: runner.os == 'Windows'
      - run: npm run provenance
        env:
          AIDRAW_RELEASE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            out/make/**/*
            out/SHA256SUMS-${{ matrix.platform }}.txt
            out/RELEASE_PROVENANCE-${{ matrix.platform }}.json
            out/THIRD_PARTY_LICENSES.json
            out/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: release/**/*
